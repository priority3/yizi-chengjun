<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d1714" />
    <link rel="icon" href="data:," />
    <!-- PWA: install + offline (dist/sw.js comes from build/sw-plugin.ts). Icons are painted by src/render/app-icon.ts. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="一字成军" />
    <title>一字成军</title>
    <style>
      /* 马善政楷书 (Ma Shan Zheng, SIL OFL 1.1 — see fonts/OFL.txt), subset by scripts/subset-font.py.
         Bundled from src/assets so Vite hashes its name: an offline cache from an older release never serves a
         subset missing the characters the new code draws. */
      @font-face {
        font-family: 'YzcjBrush';
        src: url('./src/assets/fonts/yzcj-brush.woff2') format('woff2');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1d1714;
      }
      body {
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Fixed full-screen box padded by the notch / home-indicator safe areas (never use 100vh on mobile). */
      #app {
        position: fixed;
        inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
